[package]
name = "xensemble-unigateway"
version = "3.0.0"
edition = "2024"
rust-version = "1.92"
description = "XEnsemble built-in LLM gateway (embeds UniGateway)"
license = "MIT"

[[bin]]
name = "xensemble-unigateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unigateway-config = "2.5.0"
unigateway-sdk = { version = "2.5.0", features = ["host"] }

[patch.crates-io]
unigateway-config = { path = "vendor/unigateway-config" }
unigateway-core = { path = "vendor/unigateway-core" }
