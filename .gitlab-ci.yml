stages:
  - test
  - deploy

# ============================================================
# server-tests  (对应 .github/workflows/server-tests.yml)
# ============================================================
server-tests:
  stage: test
  image: node:20
  allow_failure: true
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: xensemble
        POSTGRES_PASSWORD: xensemble
        POSTGRES_DB: xensemble
  variables:
    DATABASE_URL: postgres://xensemble:xensemble@postgres:5432/xensemble
    JWT_SECRET: test-jwt-secret-min-32-characters-long
    ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - server/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes:
        - server/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - server/package-lock.json
    paths:
      - server/node_modules/
  script:
    - cd server
    - npm ci
    - npm run db:migrate
    - npm test

# ============================================================
# deploy  (对应 .github/workflows/deploy.yml)
# ============================================================
deploy:
  stage: deploy
  image: alpine:latest
  resource_group: deploy-production   # 等价 concurrency group
  rules:
    # push 到 main 自动部署
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    # 手动从 web UI 触发 pipeline (main) 时也跑
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
  before_script:
    - command -v ssh-agent >/dev/null 2>&1 || apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - cat "$DEPLOY_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > /tmp/deploy_ssh_key
    - chmod 600 /tmp/deploy_ssh_key
    - ssh-add /tmp/deploy_ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p ${DEPLOY_PORT:-22} $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh -p ${DEPLOY_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST \
        "set -euo pipefail
         export NVM_DIR=\"\$HOME/.nvm\"
         [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
         [ -s \"\$HOME/.cargo/env\" ] && . \"\$HOME/.cargo/env\"
         cd /home/workspace/dev/xensemble
         git fetch origin main
         git reset --hard origin/main
         DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY \
         DATABASE_URL=$DATABASE_URL \
         DATABASE_SSL=$DATABASE_SSL \
         MIGRATE_DATABASE_URL=$MIGRATE_DATABASE_URL \
         LLM_ANALYZE_API_URL=$LLM_ANALYZE_API_URL \
         LLM_ANALYZE_API_KEY=$LLM_ANALYZE_API_KEY \
         LLM_ANALYZE_MODEL=$LLM_ANALYZE_MODEL \
         LLM_VERIFY_MODEL=$LLM_VERIFY_MODEL \
         bash deploy/inner_install.sh"